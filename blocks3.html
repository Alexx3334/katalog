<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор блоков</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e24; --panel:#1a1840; --panel2:#252255;
  --line:#3a3570; --line2:#524a8a;
  --ink:#f5f0ff; --dim:#b8b0d4; --faint:#7a72a0;
  --coral:#ff7b6b; --coral2:#ffb4a2;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 14px/1.5 'Golos Text',system-ui,sans-serif;
  display:flex; min-height:100vh;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 62% -10%,rgba(255,123,107,.10),transparent 60%),
             radial-gradient(700px 500px at -10% 110%,rgba(255,180,162,.06),transparent 60%);}

#side{position:sticky;top:0;height:100vh;overflow-y:auto;flex:0 0 280px;z-index:2;
  padding:24px 18px;display:flex;flex-direction:column;gap:6px;
  background:rgba(15,14,36,.85);border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.brand-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  border:1.5px solid var(--coral);border-radius:11px;font-size:24px;color:var(--coral2);
  background:radial-gradient(circle at 30% 25%,rgba(255,123,107,.25),rgba(255,123,107,.05));
  animation:glow 4.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 20px rgba(255,123,107,.4)}}
.brand h1{font:700 20px/1.1 'Cormorant Garamond',serif;letter-spacing:.02em}
.brand p{font:600 9px 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.side-lbl{margin:20px 2px 8px;font:700 10px 'Golos Text';letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
#stuList{display:flex;flex-direction:column;gap:4px;flex:1;min-height:60px}
.stu{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;
  border-radius:9px;border:1px solid transparent;background:none;color:var(--ink);cursor:pointer;transition:.18s;font-size:13px}
.stu:hover{background:var(--panel2)}
.stu.on{background:var(--panel2);border-color:var(--line2)}
.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--c)}
.stu .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.hint{font:400 11px/1.5 'Golos Text';color:var(--faint);text-align:center;margin-top:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;
  border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  font:600 13px 'Golos Text';cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--coral);color:var(--coral2)}
.btn.coral{background:linear-gradient(180deg,#ff9080,#ff6b5a);border-color:#ffb4a2;color:#2a0f0a}
.btn.coral:hover{filter:brightness(1.07);color:#2a0f0a;box-shadow:0 8px 22px rgba(255,123,107,.25)}
.btn.danger-solid{background:#e06c56;border-color:#f0907e;color:#2a0f08}
.btn.ghost{background:transparent}
.btn.dashed{border-style:dashed}
.btn.sm{padding:6px 12px;font-size:12px}
.wfull{width:100%}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
::selection{background:rgba(255,123,107,.35)}

#main{flex:1;min-width:0;position:relative;z-index:1;padding:40px 48px 80px}
.wrap{max-width:900px;margin:0 auto}
.page-title{font:700 clamp(28px,4vw,42px)/1.05 'Cormorant Garamond',serif;margin-bottom:10px}
.page-sub{font:400 14px/1.6 'Golos Text';color:var(--dim);max-width:560px;margin-bottom:24px}

.back-btn{display:inline-flex;align-items:center;gap:6px;font:500 13px 'Golos Text';color:var(--dim);
  background:none;border:0;cursor:pointer;margin-bottom:16px;padding:0;transition:.18s}
.back-btn:hover{color:var(--coral2)}

.folder-section{margin-top:28px}
.folder-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.folder-head h2{font:700 20px 'Cormorant Garamond',serif;color:var(--coral2)}
.folder-head .cnt{font:500 11px 'JetBrains Mono',monospace;color:var(--faint)}

.blocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.block-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:.2s;cursor:pointer}
.block-card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.block-card h3{font:700 17px 'Cormorant Garamond',serif;margin-bottom:6px;color:var(--coral2)}
.block-card p{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:10px}
.block-students{display:flex;flex-wrap:wrap;gap:5px}
.block-stu-chip{font:500 10.5px 'Golos Text';color:var(--dim);background:var(--panel2);border:1px solid var(--line);padding:2px 9px;border-radius:99px}

.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:44px 28px;text-align:center;margin-top:20px}
.empty-icon{font-size:40px;color:var(--faint);margin-bottom:10px}
.empty h3{font:700 24px 'Cormorant Garamond',serif;margin-bottom:6px}
.empty p{color:var(--dim);max-width:400px;margin:0 auto 18px;line-height:1.5;font-size:13.5px}

.profile-header{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.profile-dot{width:16px;height:16px;border-radius:50%;background:var(--c);flex:0 0 16px}
.profile-name{font:700 32px 'Cormorant Garamond',serif}
.profile-blocks{margin-top:20px}
.folder-group{margin-bottom:24px}
.folder-group-title{font:600 12px 'Golos Text';letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.block-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;transition:.18s;cursor:pointer}
.block-row:hover{border-color:var(--line2);background:var(--panel2)}
.block-row.assigned{border-color:var(--coral);background:rgba(255,123,107,.08)}
.block-row .b-title{font:600 14px 'Golos Text';flex:1}
.block-row .b-desc{font:400 12px 'Golos Text';color:var(--dim);margin-top:2px}
.block-row .toggle{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:.18s;flex:0 0 18px}
.block-row.assigned .toggle{background:var(--coral);border-color:var(--coral)}
.block-row.assigned .toggle::after{content:'✓';font-size:12px;color:#2a0f0a;font-weight:700}

#overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(5,5,18,.78);backdrop-filter:blur(5px);
  overflow:auto;padding:40px 16px}
#overlay.show{display:block}
.modal{width:min(580px,100%);margin:0 auto;background:#1a1840;border:1px solid var(--line2);border-radius:14px;
  padding:24px 26px 26px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.m-head h3{font:700 24px 'Cormorant Garamond',serif}
.x{background:none;border:1px solid var(--line);color:var(--dim);width:30px;height:30px;border-radius:8px;
  cursor:pointer;font-size:12px;transition:.18s}
.x:hover{color:var(--coral);border-color:var(--coral);transform:rotate(90deg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.m-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.lbl{display:block;font:700 10px 'Golos Text';letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.inp,textarea,select{width:100%;background:#12112e;border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:9px 11px;font:400 13.5px 'Golos Text';transition:.18s}
.inp:focus,textarea:focus,select:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,123,107,.18)}
textarea{resize:vertical;line-height:1.5}
.folder-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px}
.folder-row .fname{flex:1;font-size:13.5px;font-weight:500}
.folder-row .fcnt{font:500 11px 'JetBrains Mono',monospace;color:var(--faint)}
.folder-row .ib{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;transition:.18s}
.folder-row .ib:hover{color:var(--coral)}

#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:7px}
.toast{background:#252255;border:1px solid var(--line2);border-left:3px solid var(--coral);color:var(--ink);
  padding:10px 16px;border-radius:9px;font:500 13px 'Golos Text';box-shadow:0 10px 28px rgba(0,0,0,.45);
  animation:tin .3s ease;transition:.4s;max-width:320px}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3a3570;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:768px){
  body{display:block}
  #side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 12px}
  #stuList{flex-direction:row;flex-wrap:wrap}
  .stu{border:1px solid var(--line);width:auto;flex:1 1 auto;min-width:130px;padding:7px 9px}
  #main{padding:20px 14px 60px}
  .blocks-grid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">
    <div class="brand-icon">♟</div>
    <div><h1>Конструктор блоков</h1><p>учебные модули</p></div>
  </div>
  <div class="side-lbl">Ученики · <span id="stuCount">0</span></div>
  <nav id="stuList"></nav>
  <button class="btn ghost dashed wfull" data-nav="add-stu">＋ Добавить ученика</button>
  <div class="side-foot">
    <button class="btn ghost wfull" data-nav="folders">📁 Управление папками</button>
    <button class="btn coral wfull" data-nav="export">Экспорт данных</button>
    <button class="btn ghost wfull" data-nav="import">Импорт</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <p class="hint">Данные хранятся только в этом браузере</p>
  </div>
</aside>

<main id="main"></main>
<div id="overlay"></div>
<div id="toasts"></div>

<script>
'use strict';
const LS='blocks-constructor-v2';
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const COLORS=['#ff7b6b','#ffb4a2','#a78bfa','#60a5fa','#34d399','#fbbf24'];

const DEFAULT_FOLDERS=[
  {id:'f-debut',name:'Дебют'},
  {id:'f-strategy',name:'Стратегия'},
  {id:'f-endgame',name:'Эндшпиль'}
];

function load(){try{return JSON.parse(localStorage.getItem(LS));}catch{return null;}}
function save(){localStorage.setItem(LS,JSON.stringify(state));}
let state=load();
if(!state){
  state={students:[],blocks:[],folders:DEFAULT_FOLDERS.map(f=>({...f}))};
  save();
}
if(!state.folders || !state.folders.length){
  state.folders=DEFAULT_FOLDERS.map(f=>({...f}));
  save();
}

let view={type:'blocks'};
let curStuId=null;

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>t.classList.add('out'),2400);setTimeout(()=>t.remove(),2900);}

const overlay=$('#overlay');
function openModal(title,body,mount){
  overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="m-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Закрыть"></button></div>
    <div class="m-body">${body}</div></div>`;
  overlay.classList.add('show');
  $$('[data-close]',overlay).forEach(b=>b.onclick=closeModal);
  mount&&mount(overlay);
}
function closeModal(){overlay.classList.remove('show');overlay.innerHTML='';}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeModal();});
function confirmBox(msg,yes,onYes){
  openModal('Подтверждение',`<p style="font-size:14px;line-height:1.6;color:var(--dim);margin-bottom:18px">${esc(msg)}</p>
    <div class="m-actions"><button class="btn ghost" data-close>Отмена</button>
    <button class="btn danger-solid" id="cYes">${esc(yes)}</button></div>`,
    m=>{$('#cYes',m).onclick=()=>{closeModal();onYes();};});
}

function renderStudents(){
  $('#stuCount').textContent=state.students.length;
  $('#stuList').innerHTML=state.students.map(s=>`
    <button class="stu ${view.type==='student'&&curStuId===s.id?'on':''}" data-stu="${s.id}">
      <i class="dot" style="--c:${s.color}"></i>
      <span class="nm">${esc(s.name)}</span>
    </button>`).join('')||'<p class="hint" style="text-align:left">Пока никого нет</p>';
}

function renderMain(){
  const main=$('#main');
  if(view.type==='student' && curStuId){
    renderStudentProfile(main);
  } else {
    renderBlocksView(main);
  }
}

function renderBlocksView(main){
  if(!state.students.length && !state.blocks.length){
    main.innerHTML=`<div class="wrap">
      <h1 class="page-title">Конструктор блоков</h1>
      <p class="page-sub">Создавайте учебные модули, группируйте их по папкам и назначайте ученикам.</p>
      <button class="btn coral" data-nav="add-stu">＋ Добавить первого ученика</button>
    </div>`;
    return;
  }
  
  let html=`<div class="wrap">
    <h1 class="page-title">Конструктор блоков</h1>
    <p class="page-sub">Создавайте учебные модули, группируйте по папкам и назначайте ученикам.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn coral" data-nav="add-block">＋ Создать блок</button>
      <button class="btn ghost" data-nav="folders">📁 Папки</button>
    </div>`;
  
  const folderedBlocks={};
  state.folders.forEach(f=>folderedBlocks[f.id]=[]);
  let unassigned=[];
  state.blocks.forEach(b=>{
    if(b.folderId && folderedBlocks[b.folderId]){
      folderedBlocks[b.folderId].push(b);
    } else {
      unassigned.push(b);
    }
  });
  
  state.folders.forEach(f=>{
    const blocks=folderedBlocks[f.id];
    html+=`<div class="folder-section">
      <div class="folder-head">
        <h2>${esc(f.name)}</h2>
        <span class="cnt">${blocks.length} ${blocks.length===1?'блок':blocks.length<5?'блока':'блоков'}</span>
      </div>
      <div class="blocks-grid">
        ${blocks.length?blocks.map(b=>blockCardHTML(b)).join(''):
          `<div class="empty" style="grid-column:1/-1;padding:24px"><p style="color:var(--faint);font-size:12.5px;margin:0">Папка пуста</p></div>`}
      </div>
    </div>`;
  });
  
  if(unassigned.length){
    html+=`<div class="folder-section">
      <div class="folder-head">
        <h2>Без папки</h2>
        <span class="cnt">${unassigned.length}</span>
      </div>
      <div class="blocks-grid">
        ${unassigned.map(b=>blockCardHTML(b)).join('')}
      </div>
    </div>`;
  }
  
  if(!state.blocks.length){
    html+=`<div class="empty"><div class="empty-icon">📦</div><h3>Пока нет блоков</h3><p>Создайте первый учебный модуль.</p></div>`;
  }
  
  html+=`</div>`;
  main.innerHTML=html;
  $$('[data-block]',main).forEach(el=>el.addEventListener('click',()=>openBlockModal(state.blocks.find(b=>b.id===el.dataset.block))));
}

function blockCardHTML(b){
  const stuNames=b.studentIds.map(id=>state.students.find(s=>s.id===id)?.name).filter(Boolean);
  return `<div class="block-card" data-block="${b.id}">
    <h3>${esc(b.title)}</h3>
    ${b.description?`<p>${esc(b.description)}</p>`:''}
    <div class="block-students">
      ${stuNames.length?stuNames.map(n=>`<span class="block-stu-chip">${esc(n)}</span>`).join(''):'<span style="color:var(--faint);font-size:11.5px">не назначен</span>'}
    </div>
  </div>`;
}

function renderStudentProfile(main){
  const stu=state.students.find(s=>s.id===curStuId);
  if(!stu){view={type:'blocks'};renderMain();return;}
  
  const stuBlocks=state.blocks.filter(b=>b.studentIds.includes(stu.id));
  
  let html=`<div class="wrap">
    <button class="back-btn" data-nav="blocks-view">← Все блоки</button>
    <div class="profile-header">
      <i class="profile-dot" style="--c:${stu.color}"></i>
      <div>
        <div class="profile-name">${esc(stu.name)}</div>
        <div style="font:400 13px 'Golos Text';color:var(--dim);margin-top:4px">Назначено блоков: ${stuBlocks.length}</div>
      </div>
    </div>
    <div class="profile-blocks">`;
  
  const folderedBlocks={};
  state.folders.forEach(f=>folderedBlocks[f.id]=[]);
  let unassigned=[];
  stuBlocks.forEach(b=>{
    if(b.folderId && folderedBlocks[b.folderId]){
      folderedBlocks[b.folderId].push(b);
    } else {
      unassigned.push(b);
    }
  });
  
  let hasAny=false;
  state.folders.forEach(f=>{
    const blocks=folderedBlocks[f.id];
    if(!blocks.length) return;
    hasAny=true;
    html+=`<div class="folder-group">
      <div class="folder-group-title">${esc(f.name)}</div>
      ${blocks.map(b=>`<div class="block-row assigned" data-block="${b.id}">
        <div class="toggle"></div>
        <div style="flex:1;min-width:0">
          <div class="b-title">${esc(b.title)}</div>
          ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
        </div>
      </div>`).join('')}
    </div>`;
  });
  
  if(unassigned.length){
    hasAny=true;
    html+=`<div class="folder-group">
      <div class="folder-group-title">Без папки</div>
      ${unassigned.map(b=>`<div class="block-row assigned" data-block="${b.id}">
        <div class="toggle"></div>
        <div style="flex:1;min-width:0">
          <div class="b-title">${esc(b.title)}</div>
          ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
        </div>
      </div>`).join('')}
    </div>`;
  }
  
  const otherBlocks=state.blocks.filter(b=>!b.studentIds.includes(stu.id));
  if(otherBlocks.length){
    const otherFoldered={};
    state.folders.forEach(f=>otherFoldered[f.id]=[]);
    let otherUnassigned=[];
    otherBlocks.forEach(b=>{
      if(b.folderId && otherFoldered[b.folderId]) otherFoldered[b.folderId].push(b);
      else otherUnassigned.push(b);
    });
    
    html+=`<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--line)">
      <div class="folder-group-title" style="margin-bottom:12px">Доступные блоки (нажмите, чтобы назначить)</div>`;
    
    state.folders.forEach(f=>{
      const blocks=otherFoldered[f.id];
      if(!blocks.length) return;
      html+=`<div class="folder-group">
        <div class="folder-group-title">${esc(f.name)}</div>
        ${blocks.map(b=>`<div class="block-row" data-assign="${b.id}">
          <div class="toggle"></div>
          <div style="flex:1;min-width:0">
            <div class="b-title">${esc(b.title)}</div>
            ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
          </div>
        </div>`).join('')}
      </div>`;
    });
    
    if(otherUnassigned.length){
      html+=`<div class="folder-group">
        <div class="folder-group-title">Без папки</div>
        ${otherUnassigned.map(b=>`<div class="block-row" data-assign="${b.id}">
          <div class="toggle"></div>
          <div style="flex:1;min-width:0">
            <div class="b-title">${esc(b.title)}</div>
            ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
          </div>
        </div>`).join('')}
      </div>`;
    }
    html+=`</div>`;
  }
  
  if(!hasAny && !otherBlocks.length){
    html+=`<div class="empty"><div class="empty-icon">📦</div><h3>Нет блоков</h3><p>Сначала создайте блоки в конструкторе.</p></div>`;
  }
  
  html+=`</div></div>`;
  main.innerHTML=html;
  
  $$('[data-assign]',main).forEach(el=>el.addEventListener('click',()=>{
    const bid=el.dataset.assign;
    const block=state.blocks.find(b=>b.id===bid);
    if(block && !block.studentIds.includes(stu.id)){
      block.studentIds.push(stu.id);
      save();renderAll();toast(`Блок назначен: ${block.title}`);
    }
  }));
  $$('[data-block]',main).forEach(el=>el.addEventListener('click',()=>openBlockModal(state.blocks.find(b=>b.id===el.dataset.block))));
}

function openStudentModal(existing){
  const isEdit=!!existing;
  const s=existing||{color:COLORS[state.students.length%COLORS.length]};
  openModal(isEdit?'Редактирование ученика':'Новый ученик',`
    <div class="fgrid">
      <div class="full"><label class="lbl">Имя ученика *</label>
        <input id="fName" class="inp" maxlength="60" placeholder="Имя и фамилия" value="${esc(s.name||'')}"></div>
    </div>
    <div class="m-actions">
      ${isEdit?'<button class="btn danger-solid" id="fDel">Удалить</button>':''}
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn coral" id="fSave">${isEdit?'Сохранить':'Добавить'}</button>
    </div>`,
  m=>{
    $('#fSave',m).onclick=()=>{
      const name=$('#fName',m).value.trim();
      if(!name){toast('Укажите имя');$('#fName',m).focus();return;}
      if(isEdit){existing.name=name;toast('Имя обновлено');}
      else{state.students.push({id:uid(),name,color:s.color});toast('Ученик добавлен');}
      save();closeModal();renderAll();
    };
    if(isEdit){
      $('#fDel',m).onclick=()=>{
        confirmBox(`Удалить ученика «${existing.name}»? Он будет убран из всех блоков.`,'Удалить',()=>{
          state.students=state.students.filter(x=>x.id!==existing.id);
          state.blocks.forEach(b=>b.studentIds=b.studentIds.filter(id=>id!==existing.id));
          if(curStuId===existing.id){view={type:'blocks'};curStuId=null;}
          save();closeModal();renderAll();toast('Ученик удалён');
        });
      };
    }
    setTimeout(()=>$('#fName',m).focus(),60);
  });
}

function openBlockModal(existing){
  const isEdit=!!existing;
  const b=existing||{title:'',description:'',folderId:state.folders[0]?.id||null,studentIds:[]};
  
  openModal(isEdit?'Редактирование блока':'Новый блок',`
    <div class="fgrid">
      <div class="full"><label class="lbl">Название блока *</label>
        <input id="bTitle" class="inp" placeholder="Например: Завершение развития перед атакой" value="${esc(b.title||'')}"></div>
      <div class="full"><label class="lbl">Папка</label>
        <select id="bFolder" class="inp">
          <option value="">— без папки —</option>
          ${state.folders.map(f=>`<option value="${f.id}" ${b.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}
        </select></div>
      <div class="full"><label class="lbl">Описание</label>
        <textarea id="bDesc" rows="3" placeholder="Что отрабатываем, ключевые моменты…">${esc(b.description||'')}</textarea></div>
      <div class="full"><label class="lbl">Назначить ученикам</label>
        <div id="stuChecks">
          ${state.students.length?state.students.map(s=>`<label style="display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;margin-bottom:5px">
            <input type="checkbox" class="stu-cb" value="${s.id}" ${b.studentIds.includes(s.id)?'checked':''} style="accent-color:var(--coral);width:14px;height:14px">
            <i class="dot" style="--c:${s.color};width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 9px"></i>${esc(s.name)}</label>`).join(''):'<p style="color:var(--faint);font-size:12.5px">Сначала добавьте учеников</p>'}
        </div>
      </div>
    </div>
    <div class="m-actions">
      ${isEdit?'<button class="btn danger-solid" id="bDel">Удалить</button>':''}
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn coral" id="bSave">${isEdit?'Сохранить':'Создать'}</button>
    </div>`,
  m=>{
    $('#bSave',m).onclick=()=>{
      const title=$('#bTitle',m).value.trim();
      if(!title){toast('Укажите название');$('#bTitle',m).focus();return;}
      const studentIds=$$('.stu-cb:checked',m).map(cb=>cb.value);
      const folderId=$('#bFolder',m).value||null;
      const data={title,description:$('#bDesc',m).value.trim(),folderId,studentIds};
      if(isEdit){Object.assign(existing,data);toast('Блок обновлён');}
      else{state.blocks.push({id:uid(),...data});toast('Блок создан');}
      save();closeModal();renderAll();
    };
    if(isEdit){
      $('#bDel',m).onclick=()=>{
        confirmBox('Удалить этот блок?','Удалить',()=>{
          state.blocks=state.blocks.filter(x=>x.id!==existing.id);
          save();closeModal();renderAll();toast('Блок удалён');
        });
      };
    }
    setTimeout(()=>$('#bTitle',m).focus(),60);
  });
}

function openFoldersModal(){
  openModal('Управление папками',`
    <p style="font-size:13.5px;line-height:1.6;color:var(--dim);margin-bottom:16px">Папки помогают группировать блоки по темам. Вы можете добавлять свои и удалять ненужные.</p>
    <div id="foldersList">
      ${state.folders.map(f=>{
        const cnt=state.blocks.filter(b=>b.folderId===f.id).length;
        return `<div class="folder-row">
          <span class="fname">${esc(f.name)}</span>
          <span class="fcnt">${cnt} ${cnt===1?'блок':cnt<5?'блока':'блоков'}</span>
          <button class="ib" data-delfolder="${f.id}" title="Удалить папку">✕</button>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <input id="newFolderName" class="inp" placeholder="Название новой папки" style="flex:1">
      <button class="btn coral" id="addFolderBtn">Добавить</button>
    </div>
    <div class="m-actions">
      <button class="btn ghost" data-close>Закрыть</button>
    </div>`,
  m=>{
    $('#addFolderBtn',m).onclick=()=>{
      const name=$('#newFolderName',m).value.trim();
      if(!name){toast('Введите название');$('#newFolderName',m).focus();return;}
      if(state.folders.some(f=>f.name.toLowerCase()===name.toLowerCase())){toast('Такая папка уже есть');return;}
      state.folders.push({id:'f-'+uid(),name});
      save();closeModal();renderAll();toast('Папка добавлена');
    };
    $$('[data-delfolder]',m).forEach(btn=>btn.addEventListener('click',()=>{
      const fid=btn.dataset.delfolder;
      const folder=state.folders.find(f=>f.id===fid);
      if(!folder) return;
      const cnt=state.blocks.filter(b=>b.folderId===fid).length;
      confirmBox(`Удалить папку «${folder.name}»?${cnt?` ${cnt} блок(ов) останутся без папки.`:''}`,'Удалить',()=>{
        state.folders=state.folders.filter(f=>f.id!==fid);
        state.blocks.forEach(b=>{if(b.folderId===fid) b.folderId=null;});
        save();closeModal();renderAll();toast('Папка удалена');
      });
    }));
    $('#newFolderName',m).addEventListener('keydown',e=>{if(e.key==='Enter')$('#addFolderBtn',m).click();});
    setTimeout(()=>$('#newFolderName',m).focus(),60);
  });
}

function openExport(){
  openModal('Экспорт данных',`
    <p style="font-size:14px;line-height:1.6;color:var(--dim);margin-bottom:18px">Скопируйте данные или скачайте файл для резервной копии.</p>
    <textarea id="expData" readonly style="width:100%;height:200px;font:11px/1.5 'JetBrains Mono',monospace;background:#0c0b20;color:#b8b0d4;border:1px solid var(--line);border-radius:9px;padding:11px;resize:vertical">${esc(JSON.stringify(state,null,2))}</textarea>
    <div class="m-actions">
      <button class="btn ghost" id="expDl">Скачать .json</button>
      <button class="btn coral" id="expCopy">Копировать</button>
    </div>`,
  m=>{
    $('#expCopy',m).onclick=async()=>{
      const t=$('#expData',m).value;
      try{await navigator.clipboard.writeText(t);}catch{$('#expData',m).select();document.execCommand('copy');}
      $('#expCopy',m).textContent='Скопировано ✓';
      setTimeout(()=>$('#expCopy',m).textContent='Копировать',1500);
    };
    $('#expDl',m).onclick=()=>{
      const b=new Blob([$('#expData',m).value],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='blocks-backup.json';
      document.body.appendChild(a);a.click();a.remove();
    };
  });
}

document.body.addEventListener('click',ev=>{
  const nav=ev.target.closest('[data-nav]');
  if(nav){
    const v=nav.dataset.nav;
    if(v==='add-stu')openStudentModal();
    if(v==='add-block')openBlockModal();
    if(v==='folders')openFoldersModal();
    if(v==='export')openExport();
    if(v==='import')$('#importFile').click();
    if(v==='blocks-view'){view={type:'blocks'};curStuId=null;renderAll();}
    return;
  }
  const stu=ev.target.closest('[data-stu]');
  if(stu){
    curStuId=stu.dataset.stu;
    view={type:'student'};
    renderAll();
    return;
  }
});

$('#importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);
    if(!Array.isArray(data.students)||!Array.isArray(data.blocks))throw 0;
    let aS=0,aB=0,aF=0;
    data.students.forEach(s=>{if(s&&s.id&&!state.students.some(x=>x.id===s.id)){state.students.push(s);aS++;}});
    data.blocks.forEach(b=>{if(b&&b.id&&!state.blocks.some(x=>x.id===b.id)){state.blocks.push(b);aB++;}});
    if(Array.isArray(data.folders)){
      data.folders.forEach(f=>{if(f&&f.id&&!state.folders.some(x=>x.id===f.id)){state.folders.push(f);aF++;}});
    }
    save();renderAll();toast(`Импортировано: учеников — ${aS}, блоков — ${aB}, папок — ${aF}`);
  }catch{toast('Не удалось прочитать файл');}};
  r.readAsText(f);
});

function renderAll(){renderStudents();renderMain();}
renderAll();
</script>
</body>
</html>
