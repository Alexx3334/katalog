<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Юный грибник</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍄%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a3a2e; --panel:#2d5a4a; --panel2:#3d7a6a;
  --line:#4a8a7a; --line2:#6aaa9a;
  --ink:#f5f0ff; --dim:#c8d4c0; --faint:#8aaa9a;
  --coral:#ff7b6b; --coral2:#ffb4a2;
  --forest:#1a3a2e; --forest2:#2d5a4a; --grass:#4a7c5e;
  --gold:#ffd700; --gold2:#ffed4e;
  --bad-border:#dc143c;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 14px/1.5 'Golos Text',system-ui,sans-serif;
  display:flex; min-height:100vh;
  position:relative;
}

/* Сказочная поляна — SVG фон */
.forest-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.forest-bg svg{
  width:100%;
  height:100%;
}

/* Затемняющий оверлей для читаемости */
.forest-overlay{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(26,58,46,0.5) 0%, rgba(15,36,25,0.7) 100%);
}

#side{position:sticky;top:0;height:100vh;overflow-y:auto;flex:0 0 280px;z-index:2;
  padding:24px 18px;display:flex;flex-direction:column;gap:6px;
  background:rgba(26,58,46,.85);backdrop-filter:blur(8px);border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.brand-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  border:1.5px solid var(--coral);border-radius:11px;font-size:24px;color:var(--coral2);
  background:radial-gradient(circle at 30% 25%,rgba(255,123,107,.25),rgba(255,123,107,.05));
  animation:glow 4.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 20px rgba(255,123,107,.4)}}
.brand h1{font:700 20px/1.1 'Cormorant Garamond',serif;letter-spacing:.02em}
.brand p{font:600 9px 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.side-lbl{margin:20px 2px 8px;font:700 10px 'Golos Text';letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
#stuList{display:flex;flex-direction:column;gap:4px;flex:1;min-height:60px}
.stu{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;
  border-radius:9px;border:1px solid transparent;background:none;color:var(--ink);cursor:pointer;transition:.18s;font-size:13px}
.stu:hover{background:var(--panel2)}
.stu.on{background:var(--panel2);border-color:var(--line2)}
.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--c)}
.stu .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.hint{font:400 11px/1.5 'Golos Text';color:var(--faint);text-align:center;margin-top:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;
  border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  font:600 13px 'Golos Text';cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--coral);color:var(--coral2)}
.btn.coral{background:linear-gradient(180deg,#ff9080,#ff6b5a);border-color:#ffb4a2;color:#2a0f0a}
.btn.coral:hover{filter:brightness(1.07);color:#2a0f0a;box-shadow:0 8px 22px rgba(255,123,107,.25)}
.btn.danger-solid{background:#e06c56;border-color:#f0907e;color:#2a0f08}
.btn.ghost{background:transparent}
.btn.dashed{border-style:dashed}
.btn.sm{padding:6px 12px;font-size:12px}
.wfull{width:100%}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
::selection{background:rgba(255,123,107,.35)}

#main{flex:1;min-width:0;position:relative;z-index:2;padding:40px 48px 80px}
.wrap{max-width:900px;margin:0 auto}
.page-title{font:700 clamp(28px,4vw,42px)/1.05 'Cormorant Garamond',serif;margin-bottom:10px;
  text-shadow:0 2px 8px rgba(0,0,0,.4)}
.page-sub{font:400 14px/1.6 'Golos Text';color:var(--dim);max-width:560px;margin-bottom:24px;
  text-shadow:0 1px 4px rgba(0,0,0,.3)}

.back-btn{display:inline-flex;align-items:center;gap:6px;font:500 13px 'Golos Text';color:var(--dim);
  background:none;border:0;cursor:pointer;margin-bottom:16px;padding:0;transition:.18s}
.back-btn:hover{color:var(--coral2)}

.folder-section{margin-top:28px}
.folder-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.folder-head h2{font:700 20px 'Cormorant Garamond',serif;color:var(--coral2);
  text-shadow:0 1px 4px rgba(0,0,0,.3)}
.folder-head .cnt{font:500 11px 'JetBrains Mono',monospace;color:var(--faint)}

.blocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.block-card{background:rgba(45,90,74,.7);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:16px;transition:.2s;cursor:pointer;position:relative}
.block-card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.block-card h3{font:700 17px 'Cormorant Garamond',serif;margin-bottom:6px;color:var(--coral2)}
.block-card p{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:10px}
.block-students{display:flex;flex-direction:column;gap:4px}
.block-stu-row{display:flex;align-items:center;gap:7px;font:500 11px 'Golos Text';color:var(--dim)}
.block-stu-row .dot{width:7px;height:7px;flex:0 0 7px}
.block-stu-row .stu-progress{margin-left:auto;font:600 10px 'JetBrains Mono',monospace;color:var(--grass);background:rgba(74,124,94,.3);padding:1px 6px;border-radius:4px}
.block-stu-row .stu-progress.done{color:var(--gold);background:rgba(255,215,0,.2)}
.block-edit-btn{position:absolute;bottom:12px;right:12px;background:none;border:0;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;transition:.18s;font-size:14px}
.block-edit-btn:hover{color:var(--coral)}

.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:44px 28px;text-align:center;margin-top:20px;
  background:rgba(45,90,74,.3)}
.empty-icon{font-size:40px;color:var(--faint);margin-bottom:10px}
.empty h3{font:700 24px 'Cormorant Garamond',serif;margin-bottom:6px}
.empty p{color:var(--dim);max-width:400px;margin:0 auto 18px;line-height:1.5;font-size:13.5px}

.profile-header{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.profile-dot{width:16px;height:16px;border-radius:50%;background:var(--c);flex:0 0 16px}
.profile-name{font:700 32px 'Cormorant Garamond',serif;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.profile-blocks{margin-top:20px}
.folder-group{margin-bottom:24px}
.folder-group-title{font:600 12px 'Golos Text';letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.block-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;transition:.18s;cursor:pointer;position:relative;
  background:rgba(45,90,74,.5)}
.block-row:hover{border-color:var(--line2);background:var(--panel2)}
.block-row.assigned{border-color:var(--coral);background:rgba(255,123,107,.1)}
.block-row .b-title{font:600 14px 'Golos Text';flex:1}
.block-row .b-desc{font:400 12px 'Golos Text';color:var(--dim);margin-top:2px}
.block-row .toggle{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:.18s;flex:0 0 18px}
.block-row.assigned .toggle{background:var(--coral);border-color:var(--coral)}
.block-row.assigned .toggle::after{content:'✓';font-size:12px;color:#2a0f0a;font-weight:700}
.block-row .row-progress{font:600 11px 'JetBrains Mono',monospace;color:var(--grass);background:rgba(74,124,94,.3);padding:2px 7px;border-radius:5px}
.block-row .row-progress.done{color:var(--gold);background:rgba(255,215,0,.2)}

#overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(5,5,18,.78);backdrop-filter:blur(5px);
  overflow:auto;padding:40px 16px}
#overlay.show{display:block}
.modal{width:min(580px,100%);margin:0 auto;background:rgba(26,58,46,.95);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:14px;
  padding:24px 26px 26px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.m-head h3{font:700 24px 'Cormorant Garamond',serif}
.x{background:none;border:1px solid var(--line);color:var(--dim);width:30px;height:30px;border-radius:8px;
  cursor:pointer;font-size:12px;transition:.18s}
.x:hover{color:var(--coral);border-color:var(--coral);transform:rotate(90deg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.m-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.lbl{display:block;font:700 10px 'Golos Text';letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.inp,textarea,select{width:100%;background:rgba(18,40,30,.8);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:9px 11px;font:400 13.5px 'Golos Text';transition:.18s}
.inp:focus,textarea:focus,select:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,123,107,.18)}
textarea{resize:vertical;line-height:1.5}
.folder-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;
  background:rgba(45,90,74,.4)}
.folder-row .fname{flex:1;font-size:13.5px;font-weight:500}
.folder-row .fcnt{font:500 11px 'JetBrains Mono',monospace;color:var(--faint)}
.folder-row .ib{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;transition:.18s}
.folder-row .ib:hover{color:var(--coral)}

#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:7px}
.toast{background:rgba(45,90,74,.95);backdrop-filter:blur(6px);border:1px solid var(--line2);border-left:3px solid var(--coral);color:var(--ink);
  padding:10px 16px;border-radius:9px;font:500 13px 'Golos Text';box-shadow:0 10px 28px rgba(0,0,0,.45);
  animation:tin .3s ease;transition:.4s;max-width:320px}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

.mushroom-game{background:linear-gradient(180deg,#1a3a2e 0%,#0f2419 100%);border-radius:14px;padding:24px;position:relative;overflow:hidden}
.mushroom-game::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(180deg,transparent,rgba(74,124,94,.3));pointer-events:none}
.game-title{font:700 28px 'Cormorant Garamond',serif;color:var(--gold2);text-align:center;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.game-subtitle{font:400 13px 'Golos Text';color:var(--dim);text-align:center;margin-bottom:20px}
.game-student-switcher{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.stu-switch-btn{padding:6px 12px;border-radius:8px;font:600 12px 'Golos Text';cursor:pointer;transition:.2s;border:1.5px solid var(--line);background:var(--panel2);color:var(--dim);display:flex;align-items:center;gap:6px}
.stu-switch-btn:hover{border-color:var(--line2);color:var(--ink)}
.stu-switch-btn.active{border-color:var(--coral);background:rgba(255,123,107,.1);color:var(--coral2)}
.stu-switch-btn .dot{width:7px;height:7px;flex:0 0 7px}
.stu-switch-btn .stu-switch-progress{font:600 10px 'JetBrains Mono',monospace;color:var(--grass)}
.stu-switch-btn.active .stu-switch-progress{color:var(--coral)}
.stu-switch-btn.done .stu-switch-progress{color:var(--gold)}
.game-counter{font:600 14px 'JetBrains Mono',monospace;color:var(--grass);text-align:center;margin-bottom:16px;background:rgba(74,124,94,.3);display:inline-block;padding:4px 12px;border-radius:6px}
.mushroom-slots{display:flex;justify-content:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.mushroom-slot{width:60px;height:60px;border-radius:50%;background:rgba(45,90,74,.4);border:2px solid var(--grass);display:grid;place-items:center;position:relative;transition:.3s}
.mushroom-slot svg{width:42px;height:42px;animation:mushroomPop .4s cubic-bezier(.2,.9,.3,1.3)}
.mushroom-slot.bad{border:3px solid var(--bad-border);background:rgba(220,20,60,.15);box-shadow:0 0 12px rgba(220,20,60,.4)}
.mushroom-slot.gold{border-color:var(--gold);background:rgba(255,215,0,.2);box-shadow:0 0 12px rgba(255,215,0,.4)}
.mushroom-slot.gold svg{filter:drop-shadow(0 0 6px rgba(255,215,0,.6))}
@keyframes mushroomPop{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.game-actions{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.game-btn{padding:12px 24px;border-radius:10px;font:600 14px 'Golos Text';cursor:pointer;transition:.2s;border:2px solid}
.game-btn.good{background:linear-gradient(180deg,#4a7c5e,#2d5a4a);border-color:var(--grass);color:#fff}
.game-btn.good:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(74,124,94,.4)}
.game-btn.bad{background:linear-gradient(180deg,#8b4a5e,#5a2d3a);border-color:#a05a6e;color:#fff}
.game-btn.bad:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(139,74,94,.4)}
.game-controls{display:flex;gap:8px;justify-content:center;margin-top:16px}
.wolf-container{position:absolute;bottom:20px;right:20px;width:100px;height:100px;pointer-events:none;opacity:0;transition:opacity .3s}
.wolf-container.show{opacity:1;animation:wolfPeek .6s ease}
@keyframes wolfPeek{0%{transform:translateX(100px)}50%{transform:translateX(-10px)}100%{transform:translateX(0)}}
.victory-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;border-radius:14px;z-index:10}
.victory-overlay.show{display:grid;animation:victoryFade .5s ease}
@keyframes victoryFade{from{opacity:0}to{opacity:1}}
.victory-content{text-align:center}
.victory-title{font:700 42px 'Cormorant Garamond',serif;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.6);margin-bottom:12px;animation:victoryPulse 1.5s ease infinite}
@keyframes victoryPulse{50%{transform:scale(1.05)}}
.victory-sub{font:400 16px 'Golos Text';color:var(--ink);margin-bottom:20px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3a3570;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:768px){
  body{display:block}
  #side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 12px}
  #stuList{flex-direction:row;flex-wrap:wrap}
  .stu{border:1px solid var(--line);width:auto;flex:1 1 auto;min-width:130px;padding:7px 9px}
  #main{padding:20px 14px 60px}
  .blocks-grid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .mushroom-slots{gap:6px}
  .mushroom-slot{width:50px;height:50px}
  .mushroom-slot svg{width:35px;height:35px}
  .game-actions{flex-direction:column}
  .game-btn{width:100%}
}
</style>
</head>
<body>

<!-- Сказочная поляна — SVG фон -->
<div class="forest-bg">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="40%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.75" cy="0.15">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fff59d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff59d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4caf50" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <radialGradient id="treeCrown1" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="60%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
    <radialGradient id="treeCrown2" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="60%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#43a047"/>
    </radialGradient>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="50%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <radialGradient id="mushroomCap1" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </radialGradient>
    <radialGradient id="mushroomCap2" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
    <radialGradient id="mushroomCap3" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </radialGradient>
  </defs>
  
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#sunGlow)"/>
  <circle cx="1200" cy="150" r="80" fill="#fff9c4" opacity="0.6"/>
  <circle cx="1200" cy="150" r="60" fill="#fff59d" opacity="0.8"/>
  
  <g opacity="0.7">
    <ellipse cx="300" cy="180" rx="100" ry="35" fill="#ffffff"/>
    <ellipse cx="350" cy="170" rx="80" ry="30" fill="#ffffff"/>
    <ellipse cx="260" cy="175" rx="70" ry="28" fill="#ffffff"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="800" cy="140" rx="120" ry="40" fill="#ffffff"/>
    <ellipse cx="860" cy="130" rx="90" ry="35" fill="#ffffff"/>
    <ellipse cx="750" cy="135" rx="85" ry="32" fill="#ffffff"/>
  </g>
  
  <path d="M0 450 Q200 420 400 440 Q600 460 800 430 Q1000 400 1200 420 Q1400 440 1600 410 L1600 900 L0 900 Z" fill="url(#hillFar)"/>
  <path d="M0 520 Q250 490 500 510 Q750 530 1000 500 Q1250 470 1500 490 L1600 480 L1600 900 L0 900 Z" fill="url(#hillMid)"/>
  <path d="M0 600 Q300 570 600 590 Q900 610 1200 580 Q1400 560 1600 570 L1600 900 L0 900 Z" fill="url(#hillNear)"/>
  
  <g opacity="0.7">
    <rect x="145" y="380" width="12" height="120" fill="url(#trunkGrad)"/>
    <ellipse cx="151" cy="360" rx="45" ry="55" fill="url(#treeCrown1)"/>
    <ellipse cx="140" cy="350" rx="35" ry="45" fill="url(#treeCrown2)"/>
    <ellipse cx="165" cy="355" rx="38" ry="48" fill="url(#treeCrown1)"/>
  </g>
  
  <g>
    <rect x="85" y="420" width="18" height="180" fill="url(#trunkGrad)"/>

let audioCtx = null;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playGoodSound(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function playBadSound(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

function load(){
  try{
    const data = JSON.parse(localStorage.getItem(LS));
    if(data) return data;
    const old = JSON.parse(localStorage.getItem('blocks-constructor-v3'));
    if(old){
      if(old.blocks){
        old.blocks.forEach(b=>{
          if(Array.isArray(b.mushrooms) && b.mushrooms.length){
            const firstStu = b.studentIds && b.studentIds[0];
            if(firstStu){
              b.mushrooms = {[firstStu]: b.mushrooms};
            } else {
              b.mushrooms = {};
            }
          } else {
            b.mushrooms = {};
          }
        });
      }
      localStorage.setItem(LS, JSON.stringify(old));
      localStorage.removeItem('blocks-constructor-v3');
      return old;
    }
    return null;
  }catch{return null;}
}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

if(!state){
  state={students:[],blocks:[],folders:DEFAULT_FOLDERS.map(f=>({...f}))};
  save();
}
if(!state.folders || !state.folders.length){
  state.folders=DEFAULT_FOLDERS.map(f=>({...f}));
  save();
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>t.classList.add('out'),2400);setTimeout(()=>t.remove(),2900);}

const overlay=$('#overlay');
function openModal(title,body,mount){
  overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="m-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Закрыть"></button></div>
    <div class="m-body">${body}</div></div>`;
  overlay.classList.add('show');
  $$('[data-close]',overlay).forEach(b=>b.onclick=closeModal);
  mount&&mount(overlay);
}
function closeModal(){overlay.classList.remove('show');overlay.innerHTML='';}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeModal();});
function confirmBox(msg,yes,onYes){
  openModal('Подтверждение',`<p style="font-size:14px;line-height:1.6;color:var(--dim);margin-bottom:18px">${esc(msg)}</p>
    <div class="m-actions"><button class="btn ghost" data-close>Отмена</button>
    <button class="btn danger-solid" id="cYes">${esc(yes)}</button></div>`,
    m=>{$('#cYes',m).onclick=()=>{closeModal();onYes();};});
}

      <i class="dot" style="--c:${s.color}"></i>
      <span class="nm">${esc(s.name)}</span>
    </button>`).join('')||'<p class="hint" style="text-align:left">Пока никого нет</p>';
}

function getBlockProgress(block, stuId){
  if(!block.mushrooms || typeof block.mushrooms !== 'object' || Array.isArray(block.mushrooms)) return {count:0,done:false};
  const mushrooms = block.mushrooms[stuId] || [];
  if(!mushrooms.length) return {count:0,done:false};
  const last10 = mushrooms.slice(-10);
  const goodCount = last10.filter(m=>m.type==='good').length;
  const done = last10.length===10 && last10.every(m=>m.type==='good');
  return {count:goodCount,done};
}

      <button class="btn coral" data-nav="add-stu">＋ Добавить первого ученика</button>
    </div>`;
    return;
  }
  
  let html=`<div class="wrap">
    <!-- МЕНЯТЬ НАЗВАНИЕ ЗДЕСЬ (2 из 2) -->
    <h1 class="page-title">Юный грибник</h1>
    <p class="page-sub">Собирайте полезные привычки, группируйте их по папкам и назначайте ученикам.</p>

    </div>`;
  
  const folderedBlocks={};
  state.folders.forEach(f=>folderedBlocks[f.id]=[]);
  let unassigned=[];
  state.blocks.forEach(b=>{
    if(b.folderId && folderedBlocks[b.folderId]){
      folderedBlocks[b.folderId].push(b);
    } else {
      unassigned.push(b);
    }
  });
  
  state.folders.forEach(f=>{
    const blocks=folderedBlocks[f.id];
    html+=`<div class="folder-section">
      <div class="folder-head">
        <h2>${esc(f.name)}</h2>
        <span class="cnt">${blocks.length} ${blocks.length===1?'блок':blocks.length<5?'блока':'блоков'}</span>

      <div class="blocks-grid">
        ${blocks.length?blocks.map(b=>blockCardHTML(b)).join(''):
          `<div class="empty" style="grid-column:1/-1;padding:24px"><p style="color:var(--faint);font-size:12.5px;margin:0">Папка пуста</p></div>`}
      </div>
    </div>`;
  });
  
  if(unassigned.length){
    html+=`<div class="folder-section">
      <div class="folder-head">
        <h2>Без папки</h2>
        <span class="cnt">${unassigned.length}</span>
      </div>
      <div class="blocks-grid">
        ${unassigned.map(b=>blockCardHTML(b)).join('')}

  }
  
  if(!state.blocks.length){
    html+=`<div class="empty"><div class="empty-icon">📦</div><h3>Пока нет блоков</h3><p>Создайте первый учебный модуль.</p></div>`;
  }
  
  html+=`</div>`;
  main.innerHTML=html;
  $$('[data-block]',main).forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-edit-block]')) return;
    const block = state.blocks.find(b=>b.id===el.dataset.block);
    openMushroomGame(block);
  }));
  $$('[data-edit-block]',main).forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    openBlockModal(state.blocks.find(b=>b.id===el.dataset.editBlock));
  }));
}

function blockCardHTML(b){
  const progressRows = b.studentIds.map(stuId=>{
    const stu = state.students.find(s=>s.id===stuId);
    if(!stu) return '';
    const progress = getBlockProgress(b, stuId);
    const progressText = progress.done ? '✓' : (progress.count > 0 ? `${progress.count}/10` : '');
    const progressClass = progress.done ? 'done' : '';
    return `<div class="block-stu-row">
      <i class="dot" style="--c:${stu.color}"></i>
      <span>${esc(stu.name)}</span>
      ${progressText ? `<span class="stu-progress ${progressClass}">${progressText}</span>` : ''}
    </div>`;
  }).join('');
  
  const studentsHTML = progressRows || '<span style="color:var(--faint);font-size:11.5px">не назначен</span>';
  
  return `<div class="block-card" data-block="${b.id}">
    <h3>${esc(b.title)}</h3>
    ${b.description?`<p>${esc(b.description)}</p>`:''}
    <div class="block-students">
      ${studentsHTML}
    </div>
    <button class="block-edit-btn" data-edit-block="${b.id}" title="Редактировать блок">⚙</button>
  </div>`;
}

function renderStudentProfile(main){
  const stu=state.students.find(s=>s.id===curStuId);
  if(!stu){view={type:'blocks'};renderMain();return;}
  
  const stuBlocks=state.blocks.filter(b=>b.studentIds.includes(stu.id));
  
  let html=`<div class="wrap">
    <button class="back-btn" data-nav="blocks-view">← Все блоки</button>
    <div class="profile-header">
      <i class="profile-dot" style="--c:${stu.color}"></i>
      <div>
        <div class="profile-name">${esc(stu.name)}</div>
        <div style="font:400 13px 'Golos Text';color:var(--dim);margin-top:4px">Назначено блоков: ${stuBlocks.length}</div>
      </div>
    </div>
    <div class="profile-blocks">`;
  
  const folderedBlocks={};
  state.folders.forEach(f=>folderedBlocks[f.id]=[]);
  let unassigned=[];
  stuBlocks.forEach(b=>{
    if(b.folderId && folderedBlocks[b.folderId]){
      folderedBlocks[b.folderId].push(b);
    } else {
      unassigned.push(b);
    }
  });
  
  let hasAny=false;
  state.folders.forEach(f=>{
    const blocks=folderedBlocks[f.id];
    if(!blocks.length) return;
    hasAny=true;
    html+=`<div class="folder-group">
      <div class="folder-group-title">${esc(f.name)}</div>
      ${blocks.map(b=>{
        const progress = getBlockProgress(b, stu.id);
        const progressHTML = progress.done ? 
          `<div class="row-progress done">✓</div>` :
          (progress.count > 0 ? `<div class="row-progress">${progress.count}/10</div>` : '');
        return `<div class="block-row assigned" data-block="${b.id}" data-stu="${stu.id}">
        <div class="toggle"></div>
        <div style="flex:1;min-width:0">
          <div class="b-title">${esc(b.title)}</div>
          ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
        </div>
        ${progressHTML}
      </div>`;
      }).join('')}
    </div>`;
  });
  
  if(unassigned.length){
    hasAny=true;
    html+=`<div class="folder-group">
      <div class="folder-group-title">Без папки</div>
      ${unassigned.map(b=>{
        const progress = getBlockProgress(b, stu.id);
        const progressHTML = progress.done ? 
          `<div class="row-progress done">✓</div>` :
          (progress.count > 0 ? `<div class="row-progress">${progress.count}/10</div>` : '');
        return `<div class="block-row assigned" data-block="${b.id}" data-stu="${stu.id}">
        <div class="toggle"></div>
        <div style="flex:1;min-width:0">
          <div class="b-title">${esc(b.title)}</div>
          ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
        </div>
        ${progressHTML}
      </div>`;
      }).join('')}
    </div>`;
  }
  
  const otherBlocks=state.blocks.filter(b=>!b.studentIds.includes(stu.id));
  if(otherBlocks.length){
    const otherFoldered={};
    state.folders.forEach(f=>otherFoldered[f.id]=[]);
    let otherUnassigned=[];
    otherBlocks.forEach(b=>{
      if(b.folderId && otherFoldered[b.folderId]) otherFoldered[b.folderId].push(b);
      else otherUnassigned.push(b);
    });
    
    html+=`<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--line)">
      <div class="folder-group-title" style="margin-bottom:12px">Доступные блоки (нажмите, чтобы назначить)</div>`;
    
    state.folders.forEach(f=>{
      const blocks=otherFoldered[f.id];
      if(!blocks.length) return;
      html+=`<div class="folder-group">
        <div class="folder-group-title">${esc(f.name)}</div>
        ${blocks.map(b=>`<div class="block-row" data-assign="${b.id}">
          <div class="toggle"></div>
          <div style="flex:1;min-width:0">
            <div class="b-title">${esc(b.title)}</div>
            ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
          </div>
        </div>`).join('')}
      </div>`;
    });
    
    if(otherUnassigned.length){
      html+=`<div class="folder-group">
        <div class="folder-group-title">Без папки</div>
        ${otherUnassigned.map(b=>`<div class="block-row" data-assign="${b.id}">
          <div class="toggle"></div>
          <div style="flex:1;min-width:0">
            <div class="b-title">${esc(b.title)}</div>
            ${b.description?`<div class="b-desc">${esc(b.description)}</div>`:''}
          </div>
        </div>`).join('')}
      </div>`;
    }
    html+=`</div>`;
  }
  
  if(!hasAny && !otherBlocks.length){
    html+=`<div class="empty"><div class="empty-icon">📦</div><h3>Нет блоков</h3><p>Сначала создайте блоки в конструкторе.</p></div>`;
  }
  
  html+=`</div></div>`;
  main.innerHTML=html;
  
  $$('[data-assign]',main).forEach(el=>el.addEventListener('click',()=>{
    const bid=el.dataset.assign;
    const block=state.blocks.find(b=>b.id===bid);
    if(block && !block.studentIds.includes(stu.id)){
      block.studentIds.push(stu.id);
      save();renderAll();toast(`Блок назначен: ${block.title}`);
    }
  }));
  $$('[data-block]',main).forEach(el=>el.addEventListener('click',()=>{
    const block = state.blocks.find(b=>b.id===el.dataset.block);
    const stuId = el.dataset.stu || stu.id;
    openMushroomGame(block, stuId);
  }));
}

function openMushroomGame(block, initialStuId){
  if(!block) return;
  if(!block.mushrooms || typeof block.mushrooms !== 'object' || Array.isArray(block.mushrooms)){
    block.mushrooms = {};
  }
  
  let currentStuId = initialStuId || (block.studentIds && block.studentIds[0]) || null;
  if(!currentStuId && block.studentIds && block.studentIds.length){
    currentStuId = block.studentIds[0];
  }
  
  const assignedStudents = block.studentIds.map(id=>state.students.find(s=>s.id===id)).filter(Boolean);
  
  function getMushrooms(){
    return block.mushrooms[currentStuId] || [];
  }
  
  function renderGame(m){
    const mushrooms = getMushrooms();
    const last10 = mushrooms.slice(-10);
    const goodCount = last10.filter(m=>m.type==='good').length;
    const done = last10.length===10 && last10.every(m=>m.type==='good');
    
    let slotsHTML = '';
    for(let i=0; i<10; i++){
      if(i < last10.length){
        const mush = last10[i];
        const isGold = done;
        const isBad = mush.type === 'bad';
        slotsHTML += `<div class="mushroom-slot ${isGold?'gold':''} ${isBad?'bad':''}">${SVG_MUSHROOMS[mush.species]}</div>`;
      } else {
        slotsHTML += `<div class="mushroom-slot"></div>`;
      }
    }
    
    const counterText = done ? 'Квест пройден!' : `${goodCount} из 10 в серии`;
    const currentStu = state.students.find(s=>s.id===currentStuId);
    
    let switcherHTML = '';
    if(assignedStudents.length > 1){
      switcherHTML = `<div class="game-student-switcher">
        ${assignedStudents.map(s=>{
          const p = getBlockProgress(block, s.id);
          const pText = p.done ? '✓' : (p.count > 0 ? `${p.count}/10` : '');
          const isActive = s.id === currentStuId;
          const isDone = p.done;
          return `<button class="stu-switch-btn ${isActive?'active':''} ${isDone?'done':''}" data-switch-stu="${s.id}">
            <i class="dot" style="--c:${s.color}"></i>
            <span>${esc(s.name)}</span>
            ${pText ? `<span class="stu-switch-progress">${pText}</span>` : ''}
          </button>`;
        }).join('')}
      </div>`;
    }
    
    $('.m-body',m).innerHTML = `
      <div class="mushroom-game">
        <div class="game-title">🍄 Сбор грибов</div>
        <div class="game-subtitle">${esc(block.title)}</div>
        ${switcherHTML}
        ${currentStu ? `<div style="text-align:center;margin-bottom:12px;font:600 14px 'Golos Text';color:var(--coral2)">Ученик: ${esc(currentStu.name)}</div>` : ''}
        <div style="text-align:center"><div class="game-counter">${counterText}</div></div>
        <div class="mushroom-slots">${slotsHTML}</div>
        <div class="game-actions">
          <button class="game-btn good" id="gameGood">🍄 Правильно</button>
          <button class="game-btn bad" id="gameBad">🟥 Ошибка</button>
        </div>
        <div class="game-controls">
          <button class="btn ghost sm" id="gameEdit">⚙ Редактировать блок</button>
          <button class="btn ghost sm" id="gameReset">🔄 Сбросить корзинку</button>
        </div>
        <div class="wolf-container" id="wolfContainer">${SVG_WOLF}</div>
        <div class="victory-overlay ${done?'show':''}" id="victoryOverlay">
          <div class="victory-content">
            <div class="victory-title">🏆 Квест пройден!</div>
            <div class="victory-sub">Отличная работа! Все 10 грибов собраны!</div>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
              <button class="btn ghost" id="victoryReset" style="border:1px solid var(--line);color:var(--dim)">🔄 Начать заново</button>
              <button class="btn coral" id="victoryClose">Закрыть</button>
            </div>
          </div>
        </div>
      </div>
    `;
    
    attachGameHandlers(m);
  }
  
  function attachGameHandlers(m){
    $$('[data-switch-stu]',m).forEach(btn=>{
      btn.onclick = ()=>{
        currentStuId = btn.dataset.switchStu;
        renderGame(m);
      };
    });
    
    $('#gameGood',m).onclick = ()=>{
      if(!currentStuId){toast('Выберите ученика');return;}
      const goodSpecies = ['boletus','boletus_red','chanterelle'];
      const species = goodSpecies[Math.floor(Math.random()*goodSpecies.length)];
      if(!block.mushrooms[currentStuId]) block.mushrooms[currentStuId] = [];
      block.mushrooms[currentStuId].push({type:'good',species,ts:Date.now()});
      if(block.mushrooms[currentStuId].length > 10) block.mushrooms[currentStuId] = block.mushrooms[currentStuId].slice(-10);
      save();
      renderGame(m);
      playGoodSound();
      toast('🍄 Хороший гриб!');
    };
    
    $('#gameBad',m).onclick = ()=>{
      if(!currentStuId){toast('Выберите ученика');return;}
      const badSpecies = ['flyagaric','toadstool'];
      const species = badSpecies[Math.floor(Math.random()*badSpecies.length)];
      if(!block.mushrooms[currentStuId]) block.mushrooms[currentStuId] = [];
      block.mushrooms[currentStuId].push({type:'bad',species,ts:Date.now()});
      if(block.mushrooms[currentStuId].length > 10) block.mushrooms[currentStuId] = block.mushrooms[currentStuId].slice(-10);
      save();
      renderGame(m);
      playBadSound();
      
      const wolf = $('#wolfContainer',m);
      wolf.classList.add('show');
      setTimeout(()=>wolf.classList.remove('show'),1500);
      
      toast('🟥 Опасность! Волк рядом!');
    };
    
    $('#gameEdit',m).onclick = ()=>{
      closeModal();
      setTimeout(()=>openBlockModal(block),300);
    };
    
    $('#gameReset',m).onclick = ()=>{
      if(!currentStuId){toast('Выберите ученика');return;}
      confirmBox('Сбросить корзинку? Весь прогресс будет потерян.','Сбросить',()=>{
        block.mushrooms[currentStuId] = [];
        save();
        closeModal();
        renderAll();
        toast('Корзинка сброшена');
      });
    };
    
    $('#victoryClose',m).onclick = ()=>{
      closeModal();
      renderAll();
    };

    // НОВАЯ КНОПКА: Начать заново после победы
    $('#victoryReset',m).onclick = ()=>{
      if(!currentStuId){toast('Выберите ученика');return;}
      confirmBox('Начать сбор заново? Прогресс этого ученика в этом блоке будет очищен.','Начать заново',()=>{
        block.mushrooms[currentStuId] = [];
        save();
        renderGame(m); // Перерисовываем игру (скрывает оверлей победы, показывает пустые слоты)
        renderAll();   // Обновляем списки снаружи
        toast('Корзинка очищена, начинаем новый сбор!');
      });
    };
  }
  
  openModal('Сбор грибов', '', m=>{
    renderGame(m);
  });
}

function openStudentModal(existing){
  const isEdit=!!existing;
  const s=existing||{color:COLORS[state.students.length%COLORS.length]};
  openModal(isEdit?'Редактирование ученика':'Новый ученик',`
    <div class="fgrid">
      <div class="full"><label class="lbl">Имя ученика *</label>
        <input id="fName" class="inp" maxlength="60" placeholder="Имя и фамилия" value="${esc(s.name||'')}"></div>
    </div>
    <div class="m-actions">
      ${isEdit?'<button class="btn danger-solid" id="fDel">Удалить</button>':''}
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn coral" id="fSave">${isEdit?'Сохранить':'Добавить'}</button>
    </div>`,
  m=>{
    $('#fSave',m).onclick=()=>{
      const name=$('#fName',m).value.trim();
      if(!name){toast('Укажите имя');$('#fName',m).focus();return;}
      if(isEdit){existing.name=name;toast('Имя обновлено');}
      else{state.students.push({id:uid(),name,color:s.color});toast('Ученик добавлен');}
      save();closeModal();renderAll();
    };
    if(isEdit){
      $('#fDel',m).onclick=()=>{
        confirmBox(`Удалить ученика «${existing.name}»? Он будет убран из всех блоков.`,'Удалить',()=>{
          state.students=state.students.filter(x=>x.id!==existing.id);
          state.blocks.forEach(b=>{
            b.studentIds=b.studentIds.filter(id=>id!==existing.id);
            if(b.mushrooms && typeof b.mushrooms === 'object' && !Array.isArray(b.mushrooms)){
              delete b.mushrooms[existing.id];
            }
          });
          if(curStuId===existing.id){view={type:'blocks'};curStuId=null;}
          save();closeModal();renderAll();toast('Ученик удалён');
        });
      };
    }
    setTimeout(()=>$('#fName',m).focus(),60);
  });
}

function openBlockModal(existing){
  const isEdit=!!existing;
  const b=existing||{title:'',description:'',folderId:state.folders[0]?.id||null,studentIds:[],mushrooms:{}};
  
  openModal(isEdit?'Редактирование блока':'Новый блок',`

        <input id="bTitle" class="inp" placeholder="Например: Завершение развития перед атакой" value="${esc(b.title||'')}"></div>

      <div class="full"><label class="lbl">Описание</label>
        <textarea id="bDesc" rows="3" placeholder="Что отрабатываем, ключевые моменты…">${esc(b.description||'')}</textarea></div>
      <div class="full"><label class="lbl">Назначить ученикам</label>
        <div id="stuChecks">
          ${state.students.length?state.students.map(s=>`<label style="display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;margin-bottom:5px">
            <input type="checkbox" class="stu-cb" value="${s.id}" ${b.studentIds.includes(s.id)?'checked':''} style="accent-color:var(--coral);width:14px;height:14px">
            <i class="dot" style="--c:${s.color};width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 9px"></i>${esc(s.name)}</label>`).join(''):'<p style="color:var(--faint);font-size:12.5px">Сначала добавьте учеников</p>'}
        </div>
      </div>
    </div>
    <div class="m-actions">
      ${isEdit?'<button class="btn danger-solid" id="bDel">Удалить</button>':''}
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn coral" id="bSave">${isEdit?'Сохранить':'Создать'}</button>
    </div>`,
  m=>{
    $('#bSave',m).onclick=()=>{
      const title=$('#bTitle',m).value.trim();
      if(!title){toast('Укажите название');$('#bTitle',m).focus();return;}
      const studentIds=$$('.stu-cb:checked',m).map(cb=>cb.value);
      const folderId=$('#bFolder',m).value||null;
      const data={title,description:$('#bDesc',m).value.trim(),folderId,studentIds};
      if(isEdit){Object.assign(existing,data);toast('Блок обновлён');}
      else{state.blocks.push({id:uid(),...data,mushrooms:{}});toast('Блок создан');}
      save();closeModal();renderAll();
    };
    if(isEdit){
      $('#bDel',m).onclick=()=>{
        confirmBox('Удалить этот блок?','Удалить',()=>{
          state.blocks=state.blocks.filter(x=>x.id!==existing.id);
          save();closeModal();renderAll();toast('Блок удалён');
        });
      };
    }
    setTimeout(()=>$('#bTitle',m).focus(),60);
  });
}

function openFoldersModal(){
  openModal('Управление папками',`
    <p style="font-size:13.5px;line-height:1.6;color:var(--dim);margin-bottom:16px">Папки помогают группировать блоки по темам. Вы можете добавлять свои и удалять ненужные.</p>
    <div id="foldersList">
      ${state.folders.map(f=>{
        const cnt=state.blocks.filter(b=>b.folderId===f.id).length;
        return `<div class="folder-row">
          <span class="fname">${esc(f.name)}</span>
          <span class="fcnt">${cnt} ${cnt===1?'блок':cnt<5?'блока':'блоков'}</span>
          <button class="ib" data-delfolder="${f.id}" title="Удалить папку">✕</button>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <input id="newFolderName" class="inp" placeholder="Название новой папки" style="flex:1">
      <button class="btn coral" id="addFolderBtn">Добавить</button>
    </div>
    <div class="m-actions">
      <button class="btn ghost" data-close>Закрыть</button>
    </div>`,
  m=>{
    $('#addFolderBtn',m).onclick=()=>{
      const name=$('#newFolderName',m).value.trim();
      if(!name){toast('Введите название');$('#newFolderName',m).focus();return;}
      if(state.folders.some(f=>f.name.toLowerCase()===name.toLowerCase())){toast('Такая папка уже есть');return;}
      state.folders.push({id:'f-'+uid(),name});
      save();closeModal();renderAll();toast('Папка добавлена');
    };
    $$('[data-delfolder]',m).forEach(btn=>btn.addEventListener('click',()=>{
      const fid=btn.dataset.delfolder;
      const folder=state.folders.find(f=>f.id===fid);
      if(!folder) return;
      const cnt=state.blocks.filter(b=>b.folderId===fid).length;
      confirmBox(`Удалить папку «${folder.name}»?${cnt?` ${cnt} блок(ов) останутся без папки.`:''}`,'Удалить',()=>{
        state.folders=state.folders.filter(f=>f.id!==fid);
        state.blocks.forEach(b=>{if(b.folderId===fid) b.folderId=null;});
        save();closeModal();renderAll();toast('Папка удалена');
      });
    }));
    $('#newFolderName',m).addEventListener('keydown',e=>{if(e.key==='Enter')$('#addFolderBtn',m).click();});
    setTimeout(()=>$('#newFolderName',m).focus(),60);
  });
}

    <div class="m-actions">
      <button class="btn ghost" id="expDl">Скачать .json</button>
      <button class="btn coral" id="expCopy">Копировать</button>
    </div>`,
  m=>{
    $('#expCopy',m).onclick=async()=>{
      const t=$('#expData',m).value;
      try{await navigator.clipboard.writeText(t);}catch{$('#expData',m).select();document.execCommand('copy');}
      $('#expCopy',m).textContent='Скопировано ✓';
      setTimeout(()=>$('#expCopy',m).textContent='Копировать',1500);
    };
    $('#expDl',m).onclick=()=>{
      const b=new Blob([$('#expData',m).value],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='blocks-backup.json';
      document.body.appendChild(a);a.click();a.remove();
    };
  });
}

document.body.addEventListener('click',ev=>{
  const nav=ev.target.closest('[data-nav]');
  if(nav){
    const v=nav.dataset.nav;
    if(v==='add-stu')openStudentModal();
    if(v==='add-block')openBlockModal();
    if(v==='folders')openFoldersModal();
    if(v==='export')openExport();
    if(v==='import')$('#importFile').click();
    if(v==='blocks-view'){view={type:'blocks'};curStuId=null;renderAll();}
    return;
  }
  const stu=ev.target.closest('[data-stu]');
  if(stu){
    curStuId=stu.dataset.stu;
    view={type:'student'};
    renderAll();
    return;
  }
});

$('#importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);
    if(!Array.isArray(data.students)||!Array.isArray(data.blocks))throw 0;
    let aS=0,aB=0,aF=0;
    data.students.forEach(s=>{if(s&&s.id&&!state.students.some(x=>x.id===s.id)){state.students.push(s);aS++;}});
    data.blocks.forEach(b=>{
      if(b&&b.id&&!state.blocks.some(x=>x.id===b.id)){
        if(Array.isArray(b.mushrooms)){
          const firstStu = b.studentIds && b.studentIds[0];
          if(firstStu && b.mushrooms.length){
            b.mushrooms = {[firstStu]: b.mushrooms};
          } else {
            b.mushrooms = {};
          }
        }
        state.blocks.push(b);aB++;
      }
    });
    if(Array.isArray(data.folders)){
      data.folders.forEach(f=>{if(f&&f.id&&!state.folders.some(x=>x.id===f.id)){state.folders.push(f);aF++;}});
    }
    save();renderAll();toast(`Импортировано: учеников — ${aS}, блоков — ${aB}, папок — ${aF}`);
  }catch{toast('Не удалось прочитать файл');}};
  r.readAsText(f);
});

function renderAll(){renderStudents();renderMain();}
renderAll();
</script>
</body>
</html>
